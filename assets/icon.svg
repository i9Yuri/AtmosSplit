<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1E29"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo Circular Escuro Neutro -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#232838" stroke-width="8"/>

  <!-- Anéis de Cúpula 7.1.4 (Isolinhas Acústicas) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2D3748" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#384357" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#4A5568" stroke-width="2"/>

  <!-- Eixos Espaciais -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#252A36" stroke-width="3"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#252A36" stroke-width="3"/>

  <!-- Soundbar Frontal Superior (JBL Bar 1000) -->
  <rect x="136" y="86" width="240" height="32" rx="10" fill="#1F2430" stroke="#00E5FF" stroke-width="4"/>
  <circle cx="166" cy="102" r="6" fill="#00E5FF"/>
  <circle cx="256" cy="102" r="8" fill="#FFFFFF"/>
  <circle cx="346" cy="102" r="6" fill="#00E5FF"/>

  <!-- Subwoofer LFE -->
  <rect x="76" y="86" width="38" height="38" rx="6" fill="#2E1818" stroke="#FF5722" stroke-width="4"/>
  <circle cx="95" cy="105" r="8" fill="#FF5722"/>

  <!-- Satélites Traseiros Destacáveis (BL, BR) -->
  <rect x="156" y="400" width="44" height="24" rx="6" fill="#1F2430" stroke="#00E5FF" stroke-width="3"/>
  <rect x="312" y="400" width="44" height="24" rx="6" fill="#1F2430" stroke="#00E5FF" stroke-width="3"/>

  <!-- Surrounds Laterais (SL, SR) -->
  <rect x="56" y="236" width="24" height="40" rx="6" fill="#1F2430" stroke="#00E5FF" stroke-width="3"/>
  <rect x="432" y="236" width="24" height="40" rx="6" fill="#1F2430" stroke="#00E5FF" stroke-width="3"/>

  <!-- 4 Canais de Teto (TFL, TFR, TBL, TBR) com Halo Luminoso -->
  <circle cx="180" cy="180" r="16" fill="#00E5FF" fill-opacity="0.25" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="332" cy="180" r="16" fill="#00E5FF" fill-opacity="0.25" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="180" cy="332" r="16" fill="#00E5FF" fill-opacity="0.25" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="332" cy="332" r="16" fill="#00E5FF" fill-opacity="0.25" stroke="#00E5FF" stroke-width="3"/>

  <!-- Ponto Central do Ouvinte -->
  <circle cx="256" cy="256" r="32" fill="url(#centerGlow)"/>
  <circle cx="256" cy="256" r="12" fill="#00E5FF"/>
  <circle cx="256" cy="256" r="4" fill="#FFFFFF"/>

  <!-- Tipografia Sóbria Inferior -->
  <text x="256" y="468" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#E2E8F0" letter-spacing="4">ATMOSSPLIT 7.1.4</text>
</svg>
